<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>素材测试</title>
    <script src="./wj-jspsych-sdk@7.0.0.js"></script>
    <script src="./lib/jspsych@7.1.2.js"></script>
    <script src="./lib/plugin-html-keyboard-response@1.1.0.js"></script>
    <script src="./lib/plugin-preload@1.1.0.js"></script>
    <script src="./js/resource.js"></script>

    <script src="./js/formatDate.js"></script>
    <script src="./js/block1.js"></script>
    <script src="./js/block2.js"></script>
    <link href="./lib/jspsych.css" rel="stylesheet" type="text/css" />
    <style>
      body {
        background-color: #f5f7fa;
        margin: 0;
        padding: 0;
      }
      .container {
        max-width: 800px;
        margin: 0 auto;
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        padding: 30px;
        position: relative;
      }
      .progress-container {
        width: 100%;
        height: 10px;
        background-color: #e0e0e0;
        border-radius: 5px;
      }
      .progress-bar {
        height: 100%;
        background-color: #3498db;
        border-radius: 4px;
        width: 0%;
        transition: width 0.3s ease;
      }
      .buttons {
        display: flex;
        gap: 20px;
        margin-top: 10px;
        justify-content: center;
      }

      .focus-container {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .focus-container > div:first-child {
        height: 28.8px;
      }
      .focus-container .fixation {
        font-size: 36px;
        font-weight: bold;
        width: min(calc(100vh - 100px), 95vw);
        height: min(calc(100vh - 100px), 95vw);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #2c3e50;
      }
      img {
        width: min(calc(100vh - 115px), 95vw);
        height: min(calc(100vh - 115px), 95vw);
      }
      .btn {
        padding: 12px 30px;
        font-size: 16px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.3s ease;
        font-weight: bold;
      }
      .overTime {
        background-color: #e74c3c !important;
      }
      .btn-yes {
        background-color: #2ecc71;
        color: white;
      }
      .btn-yes:hover {
        background-color: #27ae60;
      }
      .btn-no {
        background-color: #e74c3c;
        color: white;
      }
      .btn-no:hover {
        background-color: #c0392b;
      }
      .form-group {
        margin-bottom: 20px;
      }
      label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #2c3e50;
      }
      input,
      select {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 16px;
      }
      .submit-btn {
        background-color: #3498db;
        color: white;
        padding: 12px 30px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        display: block;
        margin: 30px auto 0;
        transition: background-color 0.3s ease;
      }
      .submit-btn:hover {
        background-color: #2980b9;
      }

      .survey-fieldset {
        display: flex;
        flex-direction: row;
        gap: 10px;
        flex-wrap: wrap;
        max-width: 600px;
      }
      .survey-fieldset > div {
        display: flex;
        flex-direction: row;
        gap: 5px;
      }
      .survey-fieldset > div input[type="radio"] {
        width: 20px;
        height: 20px;
      }
    </style>
  </head>
  <body>
    <script src="./custom.js" />
  </body>
</html>
