<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jsPsych Hello World</title>
    <script src="/test/wj-jspsych2-test/lib/jspsych@7.1.2.js"></script>
    <script src="/test/wj-jspsych2-test/lib/plugin-html-keyboard-response@1.1.0.js"></script>
    <link href="/test/wj-jspsych2-test/lib/jspsych.css" rel="stylesheet" />
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #f5f7fa;
        margin: 0;
        padding: 0;
      }
      .result-container {
        max-width: 720px;
        margin: 40px auto;
        padding: 30px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      }
      .result-container h2 {
        margin-top: 0;
        color: #2c3e50;
      }
      .result-container pre {
        background: #f8f9fa;
        border: 1px solid #e9ecef;
        border-radius: 8px;
        padding: 16px;
        overflow-x: auto;
        font-size: 13px;
        line-height: 1.5;
        max-height: 400px;
        overflow-y: auto;
      }
      .btn-group {
        display: flex;
        gap: 12px;
        margin-top: 20px;
      }
      .btn-download {
        padding: 10px 24px;
        font-size: 14px;
        font-weight: 600;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .btn-csv {
        background-color: #2ecc71;
        color: white;
      }
      .btn-csv:hover {
        background-color: #27ae60;
      }
      .btn-json {
        background-color: #3498db;
        color: white;
      }
      .btn-json:hover {
        background-color: #2980b9;
      }
      .user-code-badge {
        display: inline-block;
        background: #eef2ff;
        color: #4f46e5;
        padding: 4px 10px;
        border-radius: 4px;
        font-size: 13px;
        font-family: monospace;
        margin-bottom: 16px;
      }
    </style>
  </head>
  <body>
    <script>
      // 生成 userCode（与 wj-jspsych2-test/custom.js 中 getUserCode() 逻辑一致）
      const getUserCode = () => {
        return 'xxxxxxyxxxxxxxx'.replace(/[xy]/g, function (c) {
          const r = (Math.random() * 16) | 0;
          const v = c === 'x' ? r : (r & 0x3) | 0x8;
          return v.toString(16);
        });
      };

      // 初始化 jsPsych
      const jsPsych = initJsPsych({
        on_finish: function () {
          // 实验结束后展示结果
          const data = jsPsych.data.get();
          const jsonStr = JSON.stringify(JSON.parse(data.json()), null, 2);

          document.querySelector('#jspsych-content').innerHTML = '';
          const container = document.createElement('div');
          container.className = 'result-container';
          container.innerHTML = `
            <h2>实验完成！</h2>
            <div class="user-code-badge">userCode: ${jsPsych.data.get().values()[0].userCode}</div>
            <h3>实验数据</h3>
            <pre>${jsonStr}</pre>
            <div class="btn-group">
              <button class="btn-download btn-csv" id="btn-csv">下载 CSV</button>
              <button class="btn-download btn-json" id="btn-json">下载 JSON</button>
            </div>
          `;
          document.body.appendChild(container);

          document.getElementById('btn-csv').addEventListener('click', function () {
            jsPsych.data.get().localSave('csv', 'hello-world-result.csv');
          });
          document.getElementById('btn-json').addEventListener('click', function () {
            jsPsych.data.get().localSave('json', 'hello-world-result.json');
          });
        }
      });

      // 添加全局属性
      const userCode = getUserCode();
      jsPsych.data.addProperties({ userCode: userCode });

      // Trial 1: 欢迎页
      const welcome = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: `
          <div style="text-align: center;">
            <h1 style="font-size: 2.5em; color: #2c3e50;">Hello, jsPsych!</h1>
            <p style="font-size: 1.2em; color: #555;">这是一个最小化的 jsPsych 实验 demo</p>
            <p style="margin-top: 30px; color: #888;">按 <kbd style="background:#eee;padding:2px 8px;border-radius:4px;border:1px solid #ccc;">空格键</kbd> 继续</p>
          </div>
        `,
        choices: [' ']
      };

      // Trial 2: 简单问题
      const question = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: `
          <div style="text-align: center;">
            <h2 style="color: #2c3e50;">你好吗？</h2>
            <p style="font-size: 1.3em; margin-top: 20px;">
              按 <kbd style="background:#d4edda;padding:4px 12px;border-radius:4px;border:1px solid #c3e6cb;font-weight:bold;">Y</kbd> = 好
              &nbsp;&nbsp;&nbsp;
              按 <kbd style="background:#f8d7da;padding:4px 12px;border-radius:4px;border:1px solid #f5c6cb;font-weight:bold;">N</kbd> = 不好
            </p>
          </div>
        `,
        choices: ['y', 'n'],
        data: { task: 'mood_question' }
      };

      // 运行实验
      jsPsych.run([welcome, question]);
    </script>
  </body>
</html>
